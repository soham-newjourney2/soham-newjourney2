name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
 
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: soham-newjourney2
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ffffff&color_dots=%23111111,%23333333,%23666666,%23999999,%23ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%230d0d0d,%23333333,%23666666,%23999999,%23ffffff

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
